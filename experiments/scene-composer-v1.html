<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>NagWeb Scene Composer</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:12px Inter,system-ui;background:#0d0c11;color:#eee}.app{display:grid;grid-template-columns:220px 1fr 280px;height:100vh}.side{background:#15131a;padding:12px;overflow:auto;border-right:1px solid #2e2a35}.right{border-right:0;border-left:1px solid #2e2a35}.work{overflow:auto;padding:32px;background:#09080c}.stage{position:relative;width:1200px;height:800px;background:#121119;overflow:hidden;border:1px solid #292631}.stage canvas{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}.item{position:absolute;touch-action:none;cursor:grab}.item.sel{outline:1px solid #8f88ff;outline-offset:3px}.inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;white-space:pre-wrap;overflow:hidden}.text .inner{justify-content:flex-start;align-items:flex-start;line-height:1.05}.item img{width:100%;height:100%}.sec{border-top:1px solid #302c37;margin-top:12px;padding-top:10px}h1{font-size:16px;margin:0 0 8px}h2{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#bbb4c6}.row{display:flex;gap:6px}.row>*{flex:1}.btn{padding:7px;background:#24212b;border:1px solid #3b3745;border-radius:7px;color:#eee;cursor:pointer}.field{display:grid;gap:3px;margin:7px 0}.field label,.muted{font-size:10px;color:#aaa4b4}.field input,.field textarea,.field select{width:100%;padding:6px;background:#0f0e14;border:1px solid #37323f;border-radius:6px;color:#eee}.layers{display:grid;gap:4px}.layer{padding:6px;border:1px solid #302d38;border-radius:6px;cursor:pointer}.layer.on{border-color:#7770ff}.hidden{display:none}.status{margin-top:10px;padding:7px;border:1px solid #302d38;border-radius:6px;font:9px ui-monospace;color:#a9dcb4}.json{height:110px}</style></head><body><div class="app">
<aside class="side"><h1>Scene Composer</h1><div class="muted">V4-C.1 + objetos editables</div><div class="sec"><h2>Personaje</h2><label class="btn">Cargar PNG<input id="characterFile" type="file" accept="image/*" hidden></label><div class="field"><label>Tamaño</label><input id="characterSize" type="range" min="160" max="620" value="360"></div><div class="field"><label>Preset</label><select id="characterPreset"><option value="character">Personaje</option><option value="creature">Criatura</option><option value="soft">Forma blanda</option></select></div><div class="field"><label>Radio global</label><input id="globalRadius" type="range" min="60" max="360" value="170"></div></div>
<div class="sec"><h2>Agregar</h2><div class="row"><button class="btn add" data-type="text">Texto</button><button class="btn add" data-type="button">Botón</button></div><div class="row"><button class="btn add" data-type="image">Imagen</button><button class="btn add" data-type="shape">Forma</button></div><button class="btn add" data-type="background">Fondo</button></div><div class="sec"><h2>Capas</h2><div id="layers" class="layers"></div></div><div class="sec"><h2>JSON</h2><textarea id="sceneJson" class="json"></textarea><div class="row"><button id="exportScene" class="btn">Actualizar</button><button id="applyScene" class="btn">Aplicar</button></div></div><div id="status" class="status">Preparando…</div></aside>
<main class="work"><div id="stage" class="stage"><canvas id="characterCanvas"></canvas><div id="leader"></div></div></main>
<aside class="side right"><h1>Inspector</h1><div id="nothing" class="muted">Seleccioná un objeto</div><div id="editor" class="hidden"><div class="sec"><h2>Elemento</h2><div class="field"><label>Nombre</label><input id="name"></div><div id="contentField" class="field"><label>Contenido</label><textarea id="content"></textarea></div><div id="imageField" class="field hidden"><label>Imagen</label><input id="imageFile" type="file" accept="image/*"></div><div class="row"><div class="field"><label>X</label><input id="x" type="number"></div><div class="field"><label>Y</label><input id="y" type="number"></div></div><div class="row"><div class="field"><label>Ancho</label><input id="width" type="number"></div><div class="field"><label>Alto</label><input id="height" type="number"></div></div><div class="row"><div class="field"><label>Rotación</label><input id="rotation" type="number"></div><div class="field"><label>Escala</label><input id="elementScale" type="number" step=".05"></div></div></div><div class="sec"><h2>Estilo</h2><div class="field"><label>Color</label><input id="color"></div><div class="field"><label>Fondo</label><input id="background"></div><div class="row"><div class="field"><label>Texto px</label><input id="fontSize" type="number"></div><div class="field"><label>Radio</label><input id="borderRadius" type="number"></div></div></div><div class="sec"><h2>Reacción</h2><label><input id="reacts" type="checkbox"> Reacciona</label><div class="field"><label>Intensidad</label><input id="weight" type="range" min="0" max="2" step=".05"></div><div class="field"><label>Distancia</label><input id="radiusScale" type="range" min=".25" max="3" step=".05"></div><div class="field"><label>Movimiento</label><input id="move" type="range" min="0" max="2" step=".05"></div><div class="field"><label>Giro</label><input id="reactRotate" type="range" min="0" max="2" step=".05"></div><div class="field"><label>Escala</label><input id="reactScale" type="range" min="0" max="2" step=".05"></div><div class="field"><label>Retorno</label><input id="returnSpeed" type="range" min=".25" max="2" step=".05"></div></div><div class="sec"><div class="row"><button id="duplicate" class="btn">Duplicar</button><button id="remove" class="btn">Eliminar</button></div></div></div></aside></div>
<script src="../js/nagweb-interaction-engine-v1.js"></script><script src="../js/nagweb-interaction-asset-prep-v1.js"></script><script src="../js/nagweb-interaction-influence-v1.js"></script><script src="../js/nagweb-interaction-organic-v3.js"></script><script src="../js/nagweb-interaction-organic-v4b.js"></script><script src="../js/nagweb-interaction-organic-v4c.js"></script><script src="../js/nagweb-scene-composer-v1.js"></script><script src="../js/nagweb-scene-composer-view-v1.js"></script><script src="../js/nagweb-scene-composer-app-v1.js"></script></body></html>
