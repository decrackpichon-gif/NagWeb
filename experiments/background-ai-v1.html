<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NagWeb · Background AI Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111218;color:#f3efe9;font-family:Inter,system-ui,sans-serif}body{min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.top h1{font-size:22px;margin:0 0 7px}.top p{max-width:650px;color:#aaa7b2;font-size:13px;line-height:1.5;margin:0}.badge{border:1px solid #3d5c48;color:#aeeac0;padding:6px 8px;font:700 10px ui-monospace,monospace;white-space:nowrap}.controls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin:22px 0}.upload,.btn,select{min-height:40px;border:1px solid #4a4b58;background:#20212a;color:#fff;padding:0 12px;font:600 12px inherit}.upload{display:flex;align-items:center;justify-content:center;cursor:pointer}.upload input{display:none}.btn{cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid #30313a;background:#171820;padding:12px}.card h2{font-size:12px;margin:0 0 10px;color:#aaa7b2;text-transform:uppercase;letter-spacing:.07em}.viewer{height:420px;display:grid;place-items:center;background:linear-gradient(45deg,#1e1f27 25%,#24252f 25%,#24252f 50%,#1e1f27 50%,#1e1f27 75%,#24252f 75%);background-size:28px 28px;overflow:hidden}.viewer img,.viewer canvas{max-width:100%;max-height:100%;object-fit:contain}.status{margin-top:12px;min-height:48px;font:11px/1.55 ui-monospace,monospace;color:#bdb8c5}.warn{color:#e8be78}.good{color:#a9e5b8}.bar{height:5px;background:#262730;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ddd;transition:width .12s}.fine{font-size:11px;color:#85828d;margin-top:15px;line-height:1.5}@media(max-width:760px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.viewer{height:300px}.top{display:block}.badge{display:inline-block;margin-top:12px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div><h1>Preparación IA · fondo transparente</h1><p>Experimento aislado. El modelo se carga recién cuando una imagen realmente necesita eliminación de fondo. El procesamiento ocurre en el navegador.</p></div>
    <span class="badge">NO INTEGRADO</span>
  </header>

  <section class="controls">
    <label class="upload">Subir imagen<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label>
    <select id="provider"><option value="general">General · ORMBG</option><option value="portrait">Retrato · MODNet</option></select>
    <select id="device"><option value="auto">Aceleración automática</option><option value="webgpu">WebGPU</option><option value="wasm">CPU / WASM</option></select>
    <button id="remove" class="btn" disabled>Eliminar fondo con IA</button>
  </section>

  <section class="grid">
    <article class="card"><h2>Original</h2><div class="viewer"><img id="original" alt=""></div><div id="inputStatus" class="status">Subí una imagen para analizarla.</div></article>
    <article class="card"><h2>Resultado</h2><div id="output" class="viewer"></div><div id="outputStatus" class="status">La IA todavía no se cargó.</div><div class="bar"><i id="progress"></i></div></article>
  </section>
  <div id="modelInfo" class="fine"></div>
</main>
<script src="../js/nagweb-interaction-asset-prep-v1.js"></script>
<script src="../js/nagweb-interaction-background-ai-v1.js"></script>
<script>
(function(){
  var A=NAGWEB_INTERACTION_ASSET_PREP,AI=NAGWEB_INTERACTION_BACKGROUND_AI;
  var file=null,url=null,analysis=null,remover=null;
  var original=document.getElementById('original'),button=document.getElementById('remove'),out=document.getElementById('output');
  function modelInfo(){
    var p=AI.providerInfo(document.getElementById('provider').value);
    document.getElementById('modelInfo').textContent=p.label+' · '+p.model+' · licencia '+p.license+' · descarga inicial aproximada '+p.approxDownloadMB+' MB. Después el navegador puede reutilizar su caché.';
  }
  function progress(evt){
    var status=document.getElementById('outputStatus'),bar=document.getElementById('progress');
    if(evt.phase==='download'&&evt.detail){
      var d=evt.detail,pc=Number(d.progress);
      if(Number.isFinite(pc))bar.style.width=Math.max(0,Math.min(100,pc))+'%';
      status.textContent='Cargando modelo local… '+(Number.isFinite(pc)?pc.toFixed(0)+'%':'');
    }else if(evt.phase==='fallback')status.textContent='WebGPU no disponible. Reintentando con CPU/WASM…';
    else if(evt.phase==='inference')status.textContent='Separando sujeto y fondo…';
    else if(evt.phase==='complete')status.textContent='Fondo eliminado. Verificando silueta…';
    else if(evt.phase==='error')status.textContent='Error: '+evt.error;
  }
  async function analyzeOriginal(){
    analysis=await A.analyzeImage(original,{maxDimension:512});
    var s=document.getElementById('inputStatus');
    s.innerHTML=(analysis.needsBackgroundRemoval?'<span class="warn">⚠ Recomendamos quitar fondo.</span>':'<span class="good">✓ Ya tiene una silueta transparente confiable.</span>')+'<br>Transparencia '+(analysis.transparentRatio*100).toFixed(1)+'% · eje '+analysis.principalAxisAngle.toFixed(1)+'°';
    button.disabled=!file||!analysis.needsBackgroundRemoval;
  }
  document.getElementById('file').addEventListener('change',function(){
    file=this.files&&this.files[0];if(!file)return;
    var old=url;url=URL.createObjectURL(file);
    original.onload=function(){if(old)URL.revokeObjectURL(old);analyzeOriginal().catch(function(e){document.getElementById('inputStatus').textContent=e.message;});};
    original.src=url;out.innerHTML='';document.getElementById('outputStatus').textContent='Listo para procesar cuando lo indiques.';
  });
  document.getElementById('provider').addEventListener('change',function(){if(remover){remover.dispose();remover=null;}modelInfo();});
  document.getElementById('device').addEventListener('change',function(){if(remover){remover.dispose();remover=null;}});
  button.addEventListener('click',async function(){
    if(!file)return;button.disabled=true;out.innerHTML='';
    try{
      remover=remover||AI.createRemover({provider:document.getElementById('provider').value,device:document.getElementById('device').value,progress:progress});
      var result=await remover.remove(file);
      out.appendChild(result.canvas);
      var check=await A.analyzeImage(result.canvas,{maxDimension:512});
      document.getElementById('outputStatus').innerHTML='<span class="'+(check.silhouetteReliable?'good':'warn')+'">'+(check.silhouetteReliable?'✓ Resultado apto para preparar interacción.':'⚠ El recorte necesita revisión.')+'</span><br>Proveedor '+result.provider+' · '+result.device+' · '+result.width+'×'+result.height;
    }catch(e){document.getElementById('outputStatus').textContent='Error: '+e.message;}
    finally{button.disabled=!analysis||!analysis.needsBackgroundRemoval;}
  });
  modelInfo();
  window.__NAGWEB_BACKGROUND_AI_LAB__={get remover(){return remover;},get analysis(){return analysis;}};
})();
</script>
</body>
</html>
