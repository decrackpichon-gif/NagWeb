<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NagWeb · Interaction Engine V1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111;color:#f5f1e8;font-family:Inter,system-ui,sans-serif}body{height:100vh;overflow:hidden}.app{height:100%;display:grid;grid-template-columns:300px 1fr}.panel{padding:18px;border-right:1px solid #333;background:#171717;overflow:auto}.panel h1{font-size:18px;margin:0 0 8px}.panel p{font-size:12px;line-height:1.45;color:#aaa;margin:0 0 18px}.field{margin:0 0 14px}.field label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.field input[type=range]{width:100%}.row{display:flex;gap:8px}.btn,.upload{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;border:1px solid #555;background:#222;color:#fff;font:600 12px inherit;cursor:pointer}.upload{width:100%;margin-bottom:14px}.upload input{display:none}.check{display:flex;gap:8px;align-items:center;font-size:12px;margin:10px 0}.stage{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#32264c 0,#181522 46%,#0d0c11 100%);touch-action:none}.hint{position:absolute;left:18px;bottom:18px;font-size:11px;color:#9e98aa;pointer-events:none}.target{position:absolute;left:0;top:0;width:180px;height:180px;display:grid;place-items:center;pointer-events:none}.visual{width:100%;height:100%;filter:drop-shadow(0 18px 20px rgba(0,0,0,.35))}.visual img{width:100%;height:100%;object-fit:contain;display:block}.status{margin-top:14px;padding-top:14px;border-top:1px solid #333;font:11px/1.5 ui-monospace,monospace;color:#9ed8a9}.pill{display:inline-block;padding:3px 6px;border:1px solid #3f5d48;color:#b6efc2;margin-bottom:8px}@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.panel{border-right:0;border-bottom:1px solid #333;max-height:48vh}.target{width:140px;height:140px}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Interactive Follower · V1</h1>
    <p>Motor genérico. Subí cualquier PNG, JPG, WebP o GIF y mové el cursor sobre el lienzo.</p>
    <label class="upload">Subir imagen<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
    <div class="field"><label>Seguimiento <output id="followOut"></output></label><input id="follow" type="range" min="0.02" max="0.30" step="0.01" value="0.09"></div>
    <div class="field"><label>Inercia <output id="dampOut"></output></label><input id="damp" type="range" min="0.55" max="0.95" step="0.01" value="0.82"></div>
    <div class="field"><label>Velocidad máxima <output id="speedOut"></output></label><input id="speed" type="range" min="5" max="80" step="1" value="34"></div>
    <div class="field"><label>Suavidad de giro <output id="turnOut"></output></label><input id="turn" type="range" min="0.03" max="0.45" step="0.01" value="0.18"></div>
    <div class="field"><label>Tilt 3D <output id="tiltOut"></output></label><input id="tilt" type="range" min="0" max="25" step="1" value="8"></div>
    <div class="field"><label>Escala por velocidad <output id="scaleOut"></output></label><input id="scale" type="range" min="0" max="0.18" step="0.01" value="0.05"></div>
    <label class="check"><input id="rotate" type="checkbox" checked> Orientar hacia el cursor</label>
    <label class="check"><input id="idle" type="checkbox" checked> Movimiento automático al quedar inactivo</label>
    <div class="row"><button id="reset" class="btn">Centrar</button><button id="pause" class="btn">Pausar</button></div>
    <div class="status"><span class="pill">LAB AISLADO</span><div id="status">motor listo</div></div>
  </aside>
  <main id="stage" class="stage">
    <div id="target" class="target"><div class="visual"><img id="asset" alt="Recurso interactivo"></div></div>
    <div class="hint">Mové el mouse. Tras 2,6 s sin interacción entra en idle.</div>
  </main>
</div>
<script src="../js/nagweb-interaction-engine-v1.js"></script>
<script>
(function(){
  var stage=document.getElementById('stage'),target=document.getElementById('target'),asset=document.getElementById('asset');
  var fallback='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe5a6"/><stop offset="1" stop-color="#ff7a8a"/></linearGradient></defs><g><path d="M110 18c33 0 62 20 75 50 10 23 9 55-4 78-15 27-42 47-71 54-29-7-56-27-71-54-13-23-14-55-4-78 13-30 42-50 75-50z" fill="url(#g)"/><circle cx="82" cy="96" r="12" fill="#211828"/><circle cx="138" cy="96" r="12" fill="#211828"/><circle cx="86" cy="91" r="4" fill="#fff"/><circle cx="142" cy="91" r="4" fill="#fff"/><path d="M79 134q31 25 62 0" fill="none" stroke="#211828" stroke-width="8" stroke-linecap="round"/><path d="M48 108 15 91l13 35zM172 108l33-17-13 35z" fill="#ff9f76"/></g></svg>');
  asset.src=fallback;
  var engine=NAGWEB_INTERACTION_ENGINE.createFollower(target,{area:stage,tilt:8});
  var defs={follow:'follow',damp:'damping',speed:'maxSpeed',turn:'turnSmoothing',tilt:'tilt',scale:'speedScale'};
  function sync(){
    var next={};Object.keys(defs).forEach(function(id){var el=document.getElementById(id);next[defs[id]]=Number(el.value);document.getElementById(id+'Out').value=el.value;});
    next.rotateToTarget=document.getElementById('rotate').checked;next.idle={enabled:document.getElementById('idle').checked};engine.setOptions(next);
  }
  Object.keys(defs).forEach(function(id){document.getElementById(id).addEventListener('input',sync);});
  document.getElementById('rotate').addEventListener('change',sync);document.getElementById('idle').addEventListener('change',sync);sync();
  document.getElementById('file').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;var u=URL.createObjectURL(f);asset.onload=function(){document.getElementById('status').textContent='imagen cargada: '+f.name;};asset.src=u;});
  document.getElementById('reset').onclick=function(){engine.reset();};
  document.getElementById('pause').onclick=function(){var b=this;if(b.dataset.p==='1'){engine.resume();b.dataset.p='0';b.textContent='Pausar';}else{engine.pause();b.dataset.p='1';b.textContent='Reanudar';}};
  window.__NAGWEB_INTERACTION_V1__={engine:engine,stage:stage,target:target};
})();
</script>
</body>
</html>
