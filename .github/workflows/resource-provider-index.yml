name: Resource Vault Verified Browse Index

on:
  push:
    branches:
      - feat/resource-etl-v1
    paths:
      - ".github/workflows/resource-provider-index.yml"
      - "tools/resource-etl/src/runtime/editor-availability.mjs"
      - "tools/resource-etl/src/editor-availability-selftest.mjs"
      - "tools/resource-etl/src/runtime/nagweb-magic-css-effect.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resource-vault-snapshot
  cancel-in-progress: false

jobs:
  provider-index:
    name: Rebuild verified browse metadata without changing source resources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout NAGWEB 05 code
        uses: actions/checkout@v4
        with:
          ref: feat/resource-etl-v1
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify lazy client and native resource classification
        working-directory: tools/resource-etl
        run: |
          node src/provider-lazy-selftest.mjs
          node src/editor-availability-selftest.mjs

      - name: Use existing independent data history
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/resource-vault-data:refs/remotes/origin/resource-vault-data
          git worktree add -b provider-index-publish "$RUNNER_TEMP/nagweb-provider-index" refs/remotes/origin/resource-vault-data
          cp "$RUNNER_TEMP/nagweb-provider-index/vault-manifest.json" "$RUNNER_TEMP/before-provider-index.json"

      - name: Rebuild indexes from identical verified archives
        shell: bash
        run: |
          node tools/resource-etl/src/snapshot/build-consolidated-vault.mjs --root="$RUNNER_TEMP/nagweb-provider-index"

      - name: Verify all 6762 resources route to their original snapshots
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { gunzipSync } from "node:zlib";
          import { createHash } from "node:crypto";
          const root=process.env.RUNNER_TEMP+"/nagweb-provider-index";
          const before=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/before-provider-index.json","utf8"));
          const after=JSON.parse(fs.readFileSync(root+"/vault-manifest.json","utf8"));
          if(before.totalResources!==6762 || after.totalResources!==before.totalResources ||
             before.snapshots.length!==5 || after.snapshots.length!==5)
            throw Error("Provider snapshot counts have changed");
          const digest=bytes=>createHash("sha256").update(bytes).digest("hex");
          const idsBySnapshot=new Map();
          for(const old of before.snapshots){
            const current=after.snapshots.find(s=>s.id===old.id);
            if(!current || current.count!==old.count ||
               current.sha256!==old.sha256 || current.libraryPath!==old.libraryPath)
              throw Error("Original provider archive changed: "+old.id);
            const archive=fs.readFileSync(path.join(root,current.libraryPath));
            if(digest(archive)!==current.sha256)throw Error("Provider checksum mismatch: "+old.id);
            const payload=JSON.parse(gunzipSync(archive).toString("utf8"));
            if(!["nagweb-provider-snapshot","nagweb-code-library"].includes(payload.format) ||
               payload.count!==current.count || payload.resources.length!==current.count)
              throw Error("Provider snapshot invalid: "+old.id);
            idsBySnapshot.set(old.id,new Set(payload.resources.map(r=>r.id)));
          }
          const compact=fs.readFileSync(path.join(root,after.consolidated.browseIndexPath));
          const all=fs.readFileSync(path.join(root,after.consolidated.libraryPath));
          if(digest(compact)!==after.consolidated.browseIndexSha256 ||
             digest(all)!==after.consolidated.sha256)
            throw Error("Consolidated checksums invalid");
          const index=JSON.parse(gunzipSync(compact).toString("utf8"));
          const library=JSON.parse(gunzipSync(all).toString("utf8"));
          if(index.resourceCount!==6762 || library.resourceCount!==6762 ||
             index.resources.length!==6762 || library.resources.length!==6762)
            throw Error("Consolidated counts invalid");
          const seen=new Set();
          for(const r of index.resources){
            if(seen.has(r.id) || !idsBySnapshot.get(r.snapshotId)?.has(r.id))
              throw Error("Missing, duplicate, or misrouted resource: "+r.id);
            seen.add(r.id);
          }
          if(index.resources.filter(r=>r.provider==="heroicons" && r.previewPaths?.length).length!==323)
            throw Error("Heroicons previews regressed");
          const lucide=index.resources.filter(r=>r.provider==="lucide" && r.previewShapes?.length).length;
          if(lucide<1800)throw Error("Lucide previews regressed: "+lucide);
          const native=index.resources.filter(r=>["svg","uiverse-html","spinkit-html","magic-css","csshake","motion-preset","three-native"].includes(r.editorUse));
          const code=index.resources.filter(r=>r.editorUse==="code");
          const motion=native.filter(r=>r.editorUse==="motion-preset");
          if(!motion.length || motion.some(r=>r.provider!=="animxyz" || !r.id.startsWith("animxyz:preset:")))
            throw Error("AnimXYZ native presets were not verified");
          const threeNative=native.filter(r=>r.editorUse==="three-native");
          const allowedNativeIds=new Set([
              "threejs:example:webgl_geometry_colors",
              "threejs:example:webgl_interactive_cubes",
              "threejs:example:webgl_materials_envmaps_fasthdr"
            ]);
          if(threeNative.length!==allowedNativeIds.size ||
             threeNative.some(r=>!allowedNativeIds.has(r.id)))
            throw Error("Native Three.js adapters do not match the three source-verified geometries");
          if(native.length!==6041+motion.length+allowedNativeIds.size ||
             code.length!==721-motion.length-allowedNativeIds.size ||
             native.filter(r=>r.editorUse==="svg").length!==2193 ||
             native.filter(r=>r.editorUse==="uiverse-html").length!==3761 ||
             native.filter(r=>r.editorUse==="spinkit-html").length!==12 ||
             native.filter(r=>r.editorUse==="magic-css").length!==65 ||
             native.filter(r=>r.editorUse==="csshake").length!==10)
            throw Error("Native/copy-only coverage disagrees with real editor adapters");
          if (native.some(r=>!(["lucide","heroicons","uiverse","spinkit","magic-css","csshake","animxyz","threejs"].includes(r.provider))) ||
              code.some(r=>r.provider==="heroicons" || r.provider==="lucide" || r.provider==="uiverse" || r.provider==="spinkit" || r.provider==="magic-css" || (r.provider==="csshake" && r.id!=="csshake:runtime")))
            throw Error("Unexpected native classification by provider");
          const shards=after.detailShards?.uiverse;
          if(!shards || shards.shards?.length!==8 ||
             shards.sourceSha256!==before.detailShards?.uiverse?.sourceSha256 ||
             index.resources.filter(r=>r.snapshotId==="uiverse" && Number.isInteger(r.detailShard)).length!==3761)
            throw Error("Existing Uiverse detail shards were lost");
          console.log("Verified library uses:",native.length,"native,",code.length,"copy/inspect,",
            "with 6762 resources, 8 Uiverse shards and original verified archives");
          NODE

      - name: Publish only derived indexes without merging
        shell: bash
        run: |
          DIR="$RUNNER_TEMP/nagweb-provider-index"
          git -C "$DIR" config user.name "github-actions[bot]"
          git -C "$DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$DIR" add vault-manifest.json README.md all
          if git -C "$DIR" diff --cached --quiet; then
            echo "Indexes already match"
            exit 0
          fi
          git -C "$DIR" commit -m "data: classify verified AnimXYZ native FX presets"
          git -C "$DIR" push origin HEAD:refs/heads/resource-vault-data
