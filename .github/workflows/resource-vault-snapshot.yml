name: Resource Vault Snapshot

on:
  push:
    branches:
      - feat/resource-etl-v1
    paths:
      - ".github/workflows/resource-vault-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resource-vault-snapshot
  cancel-in-progress: true

jobs:
  uiverse-snapshot:
    name: Build persistent lightweight snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout NagWeb ETL
        uses: actions/checkout@v4
        with:
          ref: feat/resource-etl-v1
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone source repositories
        shell: bash
        run: |
          git clone --depth=1 https://github.com/uiverse-io/galaxy.git "$RUNNER_TEMP/uiverse-galaxy"
          git -C "$RUNNER_TEMP/uiverse-galaxy" rev-parse HEAD > "$RUNNER_TEMP/uiverse-commit.txt"

          git clone --depth=1 https://github.com/lucide-icons/lucide.git "$RUNNER_TEMP/lucide"
          git -C "$RUNNER_TEMP/lucide" rev-parse HEAD > "$RUNNER_TEMP/lucide-commit.txt"

      - name: Build compact provider snapshot
        working-directory: tools/resource-etl
        shell: bash
        run: |
          SOURCE_COMMIT="$(cat "$RUNNER_TEMP/uiverse-commit.txt")"
          node src/snapshot/build-uiverse-snapshot.mjs \
            --source-dir="$RUNNER_TEMP/uiverse-galaxy" \
            --out-dir="$RUNNER_TEMP/nagweb-uiverse-snapshot" \
            --commit="$SOURCE_COMMIT"
          cp "$RUNNER_TEMP/uiverse-galaxy/LICENSE" "$RUNNER_TEMP/nagweb-uiverse-snapshot/LICENSE"

      - name: Build Lucide snapshot
        working-directory: tools/resource-etl
        shell: bash
        run: |
          SOURCE_COMMIT="$(cat "$RUNNER_TEMP/lucide-commit.txt")"
          node src/snapshot/build-lucide-snapshot.mjs \
            --source-dir="$RUNNER_TEMP/lucide" \
            --out-dir="$RUNNER_TEMP/nagweb-lucide-snapshot" \
            --commit="$SOURCE_COMMIT"
          cp "$RUNNER_TEMP/lucide/LICENSE" "$RUNNER_TEMP/nagweb-lucide-snapshot/LICENSE"

      - name: Build core lightweight Code Vault
        working-directory: tools/resource-etl
        shell: bash
        run: |
          node src/vault-cli.mjs \
            --sources=shadcn,magicui,motion-primitives,animxyz,hyperui,csshake,magic-css,glsl-noise \
            --all \
            --out="$RUNNER_TEMP/nagweb-core-vault"

          node src/snapshot/pack-vault-snapshot.mjs \
            --vault-dir="$RUNNER_TEMP/nagweb-core-vault" \
            --out-dir="$RUNNER_TEMP/nagweb-core-snapshot" \
            --name=core-code

      - name: Verify snapshot
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.RUNNER_TEMP + "/nagweb-uiverse-snapshot";
          const manifest = JSON.parse(
            fs.readFileSync(path + "/manifest.json", "utf8")
          );
          if (manifest.autonomousResources < 3000) {
            throw new Error(
              "Unexpectedly small autonomous Uiverse snapshot: " +
              manifest.autonomousResources
            );
          }
          if (!manifest.compressedSha256 || manifest.compressedSha256.length !== 64) {
            throw new Error("Missing snapshot SHA-256");
          }
          if (!fs.existsSync(path + "/library.json.gz")) {
            throw new Error("Missing compressed library");
          }
          console.log("Persistent Uiverse snapshot verified", manifest);
          NODE

          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.RUNNER_TEMP + "/nagweb-core-snapshot";
          const manifest = JSON.parse(
            fs.readFileSync(path + "/manifest.json", "utf8")
          );
          const expected = [
            "animxyz",
            "csshake",
            "glsl-noise",
            "hyperui",
            "magic-css",
            "magicui",
            "motion-primitives",
            "shadcn"
          ];
          for (const provider of expected) {
            if (!manifest.providers.includes(provider)) {
              throw new Error("Missing core provider snapshot: " + provider);
            }
          }
          if (manifest.resourceCount < 200) {
            throw new Error(
              "Unexpectedly small core snapshot: " + manifest.resourceCount
            );
          }
          if (!manifest.compressedSha256 || manifest.compressedSha256.length !== 64) {
            throw new Error("Missing core snapshot SHA-256");
          }
          console.log("Persistent core snapshot verified", manifest);
          NODE

          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.RUNNER_TEMP + "/nagweb-lucide-snapshot";
          const manifest = JSON.parse(
            fs.readFileSync(path + "/manifest.json", "utf8")
          );
          if (manifest.resourceCount < 1800) {
            throw new Error(
              "Unexpectedly small Lucide snapshot: " + manifest.resourceCount
            );
          }
          if (!manifest.compressedSha256 || manifest.compressedSha256.length !== 64) {
            throw new Error("Missing Lucide snapshot SHA-256");
          }
          console.log("Persistent Lucide snapshot verified", manifest);
          NODE

      - name: Publish resource-vault-data branch
        shell: bash
        run: |
          SNAPSHOT_DIR="$RUNNER_TEMP/nagweb-uiverse-snapshot"
          CORE_DIR="$RUNNER_TEMP/nagweb-core-snapshot"
          LUCIDE_DIR="$RUNNER_TEMP/nagweb-lucide-snapshot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan resource-vault-data
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          mkdir -p uiverse
          cp "$SNAPSHOT_DIR/library.json.gz" uiverse/library.json.gz
          cp "$SNAPSHOT_DIR/catalog.json" uiverse/catalog.json
          cp "$SNAPSHOT_DIR/manifest.json" uiverse/manifest.json
          cp "$SNAPSHOT_DIR/skipped.json" uiverse/skipped.json
          cp "$SNAPSHOT_DIR/LICENSE" uiverse/LICENSE
          cp "$SNAPSHOT_DIR/README.md" uiverse/README.md

          mkdir -p core-code
          cp "$CORE_DIR/library.json.gz" core-code/library.json.gz
          cp "$CORE_DIR/catalog.json" core-code/catalog.json
          cp "$CORE_DIR/manifest.json" core-code/manifest.json
          cp "$CORE_DIR/THIRD_PARTY_NOTICES.txt" core-code/THIRD_PARTY_NOTICES.txt
          cp "$CORE_DIR/README.md" core-code/README.md

          mkdir -p lucide
          cp "$LUCIDE_DIR/library.json.gz" lucide/library.json.gz
          cp "$LUCIDE_DIR/catalog.json" lucide/catalog.json
          cp "$LUCIDE_DIR/manifest.json" lucide/manifest.json
          cp "$LUCIDE_DIR/LICENSE" lucide/LICENSE
          cp "$LUCIDE_DIR/README.md" lucide/README.md

          cat > README.md <<'EOF'
          # NagWeb Resource Vault Data

          Generated persistent snapshots of lightweight resources mirrored by NagWeb under their verified redistribution licenses.

          This branch is generated data, not application source code. It is force-refreshed so snapshot history does not grow without bound.

          Current snapshots:
          - Uiverse Galaxy
          - Lucide Icons
          - Core Code Vault: Shadcn, Magic UI, Motion Primitives, AnimXYZ, HyperUI, CSSShake, Magic.css and GLSL Noise
          EOF

          git add README.md uiverse core-code lucide
          git commit -m "data: refresh lightweight resource snapshots"
          git push --force origin HEAD:resource-vault-data
