name: Resource Vault Snapshot
# snapshot schema: 3

on:
  push:
    branches:
      - feat/resource-etl-v1
    paths:
      - ".github/workflows/resource-vault-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resource-vault-snapshot
  cancel-in-progress: true

jobs:
  uiverse-snapshot:
    name: Build persistent lightweight snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout NagWeb ETL
        uses: actions/checkout@v4
        with:
          ref: feat/resource-etl-v1
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone source repositories
        shell: bash
        run: |
          git clone --depth=1 https://github.com/uiverse-io/galaxy.git "$RUNNER_TEMP/uiverse-galaxy"
          git -C "$RUNNER_TEMP/uiverse-galaxy" rev-parse HEAD > "$RUNNER_TEMP/uiverse-commit.txt"

          git clone --depth=1 https://github.com/lucide-icons/lucide.git "$RUNNER_TEMP/lucide"
          git -C "$RUNNER_TEMP/lucide" rev-parse HEAD > "$RUNNER_TEMP/lucide-commit.txt"

          git clone --depth=1 --filter=blob:none --no-checkout --branch dev https://github.com/mrdoob/three.js.git "$RUNNER_TEMP/threejs"
          git -C "$RUNNER_TEMP/threejs" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/threejs" sparse-checkout set "/examples/*.html" "/LICENSE"
          git -C "$RUNNER_TEMP/threejs" checkout
          git -C "$RUNNER_TEMP/threejs" rev-parse HEAD > "$RUNNER_TEMP/threejs-commit.txt"

      - name: Build compact provider snapshot
        working-directory: tools/resource-etl
        shell: bash
        run: |
          SOURCE_COMMIT="$(cat "$RUNNER_TEMP/uiverse-commit.txt")"
          node src/snapshot/build-uiverse-snapshot.mjs \
            --source-dir="$RUNNER_TEMP/uiverse-galaxy" \
            --out-dir="$RUNNER_TEMP/nagweb-uiverse-snapshot" \
            --commit="$SOURCE_COMMIT"
          cp "$RUNNER_TEMP/uiverse-galaxy/LICENSE" "$RUNNER_TEMP/nagweb-uiverse-snapshot/LICENSE"

      - name: Build Lucide snapshot
        working-directory: tools/resource-etl
        shell: bash
        run: |
          SOURCE_COMMIT="$(cat "$RUNNER_TEMP/lucide-commit.txt")"
          node src/snapshot/build-lucide-snapshot.mjs \
            --source-dir="$RUNNER_TEMP/lucide" \
            --out-dir="$RUNNER_TEMP/nagweb-lucide-snapshot" \
            --commit="$SOURCE_COMMIT"
          cp "$RUNNER_TEMP/lucide/LICENSE" "$RUNNER_TEMP/nagweb-lucide-snapshot/LICENSE"

      - name: Build Three.js code-only snapshot
        working-directory: tools/resource-etl
        shell: bash
        run: |
          SOURCE_COMMIT="$(cat "$RUNNER_TEMP/threejs-commit.txt")"
          node src/snapshot/build-threejs-code-snapshot.mjs \
            --source-dir="$RUNNER_TEMP/threejs" \
            --out-dir="$RUNNER_TEMP/nagweb-threejs-snapshot" \
            --commit="$SOURCE_COMMIT"
          cp "$RUNNER_TEMP/threejs/LICENSE" "$RUNNER_TEMP/nagweb-threejs-snapshot/LICENSE"

      - name: Build core lightweight Code Vault
        working-directory: tools/resource-etl
        shell: bash
        run: |
          node src/vault-cli.mjs \
            --sources=shadcn,magicui,motion-primitives,animxyz,hyperui,csshake,magic-css,spinkit,glsl-noise \
            --all \
            --out="$RUNNER_TEMP/nagweb-core-vault"

          node src/snapshot/pack-vault-snapshot.mjs \
            --vault-dir="$RUNNER_TEMP/nagweb-core-vault" \
            --out-dir="$RUNNER_TEMP/nagweb-core-snapshot" \
            --name=core-code

      - name: Verify snapshot
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.RUNNER_TEMP + "/nagweb-uiverse-snapshot";
          const manifest = JSON.parse(
            fs.readFileSync(path + "/manifest.json", "utf8")
          );
          if (manifest.autonomousResources < 3000) {
            throw new Error(
              "Unexpectedly small autonomous Uiverse snapshot: " +
              manifest.autonomousResources
            );
          }
          if (!manifest.compressedSha256 || manifest.compressedSha256.length !== 64) {
            throw new Error("Missing snapshot SHA-256");
          }
          if (!fs.existsSync(path + "/library.json.gz")) {
            throw new Error("Missing compressed library");
          }
          console.log("Persistent Uiverse snapshot verified", manifest);
          NODE

          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.RUNNER_TEMP + "/nagweb-core-snapshot";
          const manifest = JSON.parse(
            fs.readFileSync(path + "/manifest.json", "utf8")
          );
          const expected = [
            "animxyz",
            "csshake",
            "glsl-noise",
            "hyperui",
            "magic-css",
            "magicui",
            "motion-primitives",
            "shadcn",
            "spinkit"
          ];
          for (const provider of expected) {
            if (!manifest.providers.includes(provider)) {
              throw new Error("Missing core provider snapshot: " + provider);
            }
          }
          if (manifest.resourceCount < 200) {
            throw new Error(
              "Unexpectedly small core snapshot: " + manifest.resourceCount
            );
          }
          if (!manifest.compressedSha256 || manifest.compressedSha256.length !== 64) {
            throw new Error("Missing core snapshot SHA-256");
          }
          console.log("Persistent core snapshot verified", manifest);
          NODE

          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.RUNNER_TEMP + "/nagweb-lucide-snapshot";
          const manifest = JSON.parse(
            fs.readFileSync(path + "/manifest.json", "utf8")
          );
          if (manifest.resourceCount < 1800) {
            throw new Error(
              "Unexpectedly small Lucide snapshot: " + manifest.resourceCount
            );
          }
          if (!manifest.compressedSha256 || manifest.compressedSha256.length !== 64) {
            throw new Error("Missing Lucide snapshot SHA-256");
          }
          console.log("Persistent Lucide snapshot verified", manifest);
          NODE

          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.RUNNER_TEMP + "/nagweb-threejs-snapshot";
          const manifest = JSON.parse(
            fs.readFileSync(path + "/manifest.json", "utf8")
          );
          if (manifest.codeOnlyResources < 50) {
            throw new Error(
              "Unexpectedly small Three.js code-only snapshot: " +
              manifest.codeOnlyResources
            );
          }
          if (
            manifest.codeOnlyResources + manifest.rejectedResources !==
            manifest.totalScanned
          ) {
            throw new Error("Three.js snapshot accounting mismatch");
          }
          if (!manifest.compressedSha256 || manifest.compressedSha256.length !== 64) {
            throw new Error("Missing Three.js snapshot SHA-256");
          }
          console.log("Persistent Three.js snapshot verified", manifest);
          NODE

      - name: Publish resource-vault-data branch
        shell: bash
        run: |
          SNAPSHOT_DIR="$RUNNER_TEMP/nagweb-uiverse-snapshot"
          CORE_DIR="$RUNNER_TEMP/nagweb-core-snapshot"
          LUCIDE_DIR="$RUNNER_TEMP/nagweb-lucide-snapshot"
          THREEJS_DIR="$RUNNER_TEMP/nagweb-threejs-snapshot"
          PUBLISH_DIR="$RUNNER_TEMP/nagweb-resource-vault-publish"

          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR/uiverse" "$PUBLISH_DIR/core-code" "$PUBLISH_DIR/lucide" "$PUBLISH_DIR/threejs-code"

          cp "$SNAPSHOT_DIR/library.json.gz" "$PUBLISH_DIR/uiverse/library.json.gz"
          cp "$SNAPSHOT_DIR/catalog.json" "$PUBLISH_DIR/uiverse/catalog.json"
          cp "$SNAPSHOT_DIR/manifest.json" "$PUBLISH_DIR/uiverse/manifest.json"
          cp "$SNAPSHOT_DIR/skipped.json" "$PUBLISH_DIR/uiverse/skipped.json"
          cp "$SNAPSHOT_DIR/LICENSE" "$PUBLISH_DIR/uiverse/LICENSE"
          cp "$SNAPSHOT_DIR/README.md" "$PUBLISH_DIR/uiverse/README.md"

          cp "$CORE_DIR/library.json.gz" "$PUBLISH_DIR/core-code/library.json.gz"
          cp "$CORE_DIR/catalog.json" "$PUBLISH_DIR/core-code/catalog.json"
          cp "$CORE_DIR/manifest.json" "$PUBLISH_DIR/core-code/manifest.json"
          cp "$CORE_DIR/THIRD_PARTY_NOTICES.txt" "$PUBLISH_DIR/core-code/THIRD_PARTY_NOTICES.txt"
          cp "$CORE_DIR/README.md" "$PUBLISH_DIR/core-code/README.md"

          cp "$LUCIDE_DIR/library.json.gz" "$PUBLISH_DIR/lucide/library.json.gz"
          cp "$LUCIDE_DIR/catalog.json" "$PUBLISH_DIR/lucide/catalog.json"
          cp "$LUCIDE_DIR/manifest.json" "$PUBLISH_DIR/lucide/manifest.json"
          cp "$LUCIDE_DIR/LICENSE" "$PUBLISH_DIR/lucide/LICENSE"
          cp "$LUCIDE_DIR/README.md" "$PUBLISH_DIR/lucide/README.md"

          cp "$THREEJS_DIR/library.json.gz" "$PUBLISH_DIR/threejs-code/library.json.gz"
          cp "$THREEJS_DIR/catalog.json" "$PUBLISH_DIR/threejs-code/catalog.json"
          cp "$THREEJS_DIR/manifest.json" "$PUBLISH_DIR/threejs-code/manifest.json"
          cp "$THREEJS_DIR/rejected.json" "$PUBLISH_DIR/threejs-code/rejected.json"
          cp "$THREEJS_DIR/LICENSE" "$PUBLISH_DIR/threejs-code/LICENSE"
          cp "$THREEJS_DIR/README.md" "$PUBLISH_DIR/threejs-code/README.md"

          node tools/resource-etl/src/snapshot/build-global-vault-manifest.mjs \
            --root="$PUBLISH_DIR"

          node tools/resource-etl/src/snapshot/build-consolidated-vault.mjs \
            --root="$PUBLISH_DIR"

          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(
            fs.readFileSync(
              process.env.RUNNER_TEMP +
                "/nagweb-resource-vault-publish/vault-manifest.json",
              "utf8"
            )
          );
          const all = manifest.consolidated;
          if (!all || all.count !== manifest.totalResources) {
            throw new Error("Consolidated Vault count mismatch");
          }
          if (!all.sha256 || all.sha256.length !== 64) {
            throw new Error("Missing consolidated Vault SHA-256");
          }
          if (!all.browseIndexSha256 || all.browseIndexSha256.length !== 64) {
            throw new Error("Missing global browse-index SHA-256");
          }
          console.log(
            "Consolidated Vault verified",
            all.count,
            all.compressedBytes,
            all.browseIndexBytes
          );
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan resource-vault-data
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -R "$PUBLISH_DIR"/. .

          git add README.md vault-manifest.json all uiverse core-code lucide threejs-code
          git commit -m "data: refresh lightweight resource snapshots"
          git push --force origin HEAD:resource-vault-data
