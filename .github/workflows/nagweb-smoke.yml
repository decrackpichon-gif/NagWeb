name: NagWeb smoke

on:
  push:
    branches:
      - feature/creativos-v14
      - feat/storytelling-engine-v2
      - internal-motion-lab
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [procedural, editor, diagonal, grid, zoom, drop, shift, spiral, film, totem, peel, burst, photo, wheel, spin, bottom, cover, cover-vertical, ring, ring-vertical, trail, dance, deck, showcase, split, wipe, stripe]
    name: browser-smoke (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save puppeteer-core
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nagweb-http.log 2>&1 &
          echo $! > /tmp/nagweb-http.pid
          sleep 2
      - name: Run browser smoke
        env:
          NAGWEB_SMOKE_SUITE: ${{ matrix.suite }}
        run: node .github/nagweb-smoke.mjs
      - name: Save Motion Lab visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-lab-visuals-${{ matrix.suite }}
          path: /tmp/nagweb-motion-visuals
          if-no-files-found: ignore
          retention-days: 7
