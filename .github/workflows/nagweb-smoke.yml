name: NagWeb smoke

on:
  push:
    branches:
      - feature/creativos-v14
      - feat/storytelling-engine-v2
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save puppeteer-core
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nagweb-http.log 2>&1 &
          echo $! > /tmp/nagweb-http.pid
          sleep 2
      - name: Run browser smoke
        run: node .github/nagweb-smoke.mjs
