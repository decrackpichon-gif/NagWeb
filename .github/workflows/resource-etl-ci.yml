name: Resource ETL CI

on:
  push:
    branches:
      - feat/resource-etl-v1
    paths:
      - "tools/resource-etl/**"
      - "js/nagweb-resource-library.mjs"
      - "js/nagweb-workspace-v16.js"
      - "index.html"
      - ".github/workflows/resource-etl-ci.yml"
  workflow_dispatch:

concurrency:
  group: resource-etl-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NAGWEB_GITHUB_TOKEN: ${{ github.token }}

jobs:
  browser-smoke:
    name: Chromium panel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser driver
        working-directory: tools/resource-etl
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        working-directory: tools/resource-etl
        run: npx playwright install --with-deps chromium
      - name: Exercise Resource Browser in Chromium
        working-directory: tools/resource-etl
        run: npm run test:browser
      - name: Save browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-browser-${{ matrix.os }}
          path: tools/resource-etl/browser-smoke-results/
          if-no-files-found: warn
          retention-days: 7

  self-test:
    name: Self test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install preview compiler dependencies
        working-directory: tools/resource-etl
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run offline self-test
        working-directory: tools/resource-etl
        run: npm test

      - name: Build small Code Vault over the network
        working-directory: tools/resource-etl
        run: >
          node src/vault-cli.mjs
          --sources=lucide,shadcn,magicui,motion-primitives,animxyz,threejs,hyperui,csshake,spinkit,glsl-noise
          --limit=2
          --out=ci-vault
          --react-previews
          --react-preview-limit=8

      - name: Show React preview audit
        working-directory: tools/resource-etl
        shell: bash
        run: |
          cat ci-vault/react-preview-audit.json

      - name: Verify portable bundle exists
        working-directory: tools/resource-etl
        run: |
          test -f ci-vault/catalog.json
          test -f ci-vault/nagweb-code-library.json
          test -f ci-vault/THIRD_PARTY_NOTICES.txt
          test -f ci-vault/react-preview-audit.json
          test -f ci-vault/index.html
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('ci-vault/catalog.json','utf8')); if (!c.count || c.count < 5) process.exit(1); console.log('Vault resources:', c.count)"

      - name: Verify Vault registry dependency resolution
        working-directory: tools/resource-etl
        shell: bash
        run: |
          node src/vault-cli.mjs \
            --sources=shadcn \
            --limit=27 \
            --out=ci-vault-shadcn \
            --react-previews \
            --react-preview-limit=36

          node - <<'NODE'
          const fs = require("fs");
          const audit = JSON.parse(
            fs.readFileSync("ci-vault-shadcn/react-preview-audit.json", "utf8")
          );
          const item = audit.items.find(
            (entry) => entry.resourceId === "shadcn:alert-dialog"
          );
          if (!item || !item.ok) {
            console.error("shadcn:alert-dialog did not resolve from the local Vault");
            console.error(JSON.stringify(item, null, 2));
            process.exit(1);
          }
          if (!item.registryResources.includes("shadcn:button")) {
            console.error("Expected shadcn:button as a local registry dependency");
            process.exit(1);
          }

          const buttonGroup = audit.items.find(
            (entry) => entry.resourceId === "shadcn:button-group"
          );
          if (!buttonGroup || !buttonGroup.ok) {
            console.error("shadcn:button-group did not resolve from the local Vault");
            console.error(JSON.stringify(buttonGroup, null, 2));
            process.exit(1);
          }

          for (const dependency of ["shadcn:button", "shadcn:separator"]) {
            if (!buttonGroup.registryResources.includes(dependency)) {
              console.error("Expected local registry dependency:", dependency);
              console.error(JSON.stringify(buttonGroup, null, 2));
              process.exit(1);
            }
          }

          const inputOtp = audit.items.find(
            (entry) => entry.resourceId === "shadcn:input-otp"
          );
          if (!inputOtp || !inputOtp.ok) {
            console.error("shadcn:input-otp did not compile with input-otp");
            console.error(JSON.stringify(inputOtp, null, 2));
            process.exit(1);
          }

          const form = audit.items.find(
            (entry) => entry.resourceId === "shadcn:form"
          );
          if (!form || !form.ok) {
            console.error("shadcn:form did not compile with react-hook-form");
            console.error(JSON.stringify(form, null, 2));
            process.exit(1);
          }

          const drawer = audit.items.find(
            (entry) => entry.resourceId === "shadcn:drawer"
          );
          if (!drawer || !drawer.ok) {
            console.error("shadcn:drawer did not compile with vaul");
            console.error(JSON.stringify(drawer, null, 2));
            process.exit(1);
          }

          const calendar = audit.items.find(
            (entry) => entry.resourceId === "shadcn:calendar"
          );
          if (!calendar || !calendar.ok) {
            console.error("shadcn:calendar did not compile with react-day-picker");
            console.error(JSON.stringify(calendar, null, 2));
            process.exit(1);
          }

          const carousel = audit.items.find(
            (entry) => entry.resourceId === "shadcn:carousel"
          );
          if (!carousel || !carousel.ok) {
            console.error("shadcn:carousel did not compile with embla-carousel-react");
            console.error(JSON.stringify(carousel, null, 2));
            process.exit(1);
          }

          const command = audit.items.find(
            (entry) => entry.resourceId === "shadcn:command"
          );
          if (!command || !command.ok) {
            console.error("shadcn:command did not compile with local dialog + cmdk");
            console.error(JSON.stringify(command, null, 2));
            process.exit(1);
          }

          const chart = audit.items.find(
            (entry) => entry.resourceId === "shadcn:chart"
          );
          if (!chart || !chart.ok) {
            console.error("shadcn:chart did not compile with safe style injection + Recharts");
            console.error(JSON.stringify(chart, null, 2));
            process.exit(1);
          }

          const dialog = audit.items.find(
            (entry) => entry.resourceId === "shadcn:dialog"
          );
          if (!dialog || !dialog.ok) {
            console.error("shadcn:dialog did not resolve its code-import dependency");
            console.error(JSON.stringify(dialog, null, 2));
            process.exit(1);
          }
          if (!dialog.registryResources.includes("shadcn:button")) {
            console.error("Expected shadcn:button inferred from dialog.tsx import");
            process.exit(1);
          }

          console.log("Registry dependency resolution: OK");
          NODE

      - name: Measure Shadcn React preview coverage
        working-directory: tools/resource-etl
        shell: bash
        run: |
          node src/vault-cli.mjs \
            --sources=shadcn \
            --all \
            --out=ci-vault-shadcn-coverage \
            --react-previews \
            --react-preview-limit=100

          node src/report/react-preview-coverage.mjs \
            --file=ci-vault-shadcn-coverage/react-preview-audit.json

          node - <<'NODE'
          const fs = require("fs");
          const audit = JSON.parse(
            fs.readFileSync(
              "ci-vault-shadcn-coverage/react-preview-audit.json",
              "utf8"
            )
          );
          const sidebar = audit.items.find(
            (entry) => entry.resourceId === "shadcn:sidebar"
          );
          if (!sidebar || !sidebar.ok) {
            console.error("shadcn:sidebar did not compile from the local Vault");
            console.error(JSON.stringify(sidebar, null, 2));
            process.exit(1);
          }
          if (!sidebar.registryResources.includes("shadcn:use-mobile")) {
            console.error("Expected shadcn:use-mobile as local code helper");
            process.exit(1);
          }
          console.log("Sidebar helper resolution: OK");
          NODE

      - name: Measure Magic UI React preview coverage
        working-directory: tools/resource-etl
        shell: bash
        run: |
          node src/vault-cli.mjs \
            --sources=magicui,shadcn \
            --all \
            --out=ci-vault-magicui-coverage \
            --react-previews \
            --react-preview-limit=100

          node src/report/react-preview-coverage.mjs \
            --file=ci-vault-magicui-coverage/react-preview-audit.json \
            --provider=magicui

          node - <<'NODE'
          const fs = require("fs");
          const audit = JSON.parse(
            fs.readFileSync(
              "ci-vault-magicui-coverage/react-preview-audit.json",
              "utf8"
            )
          );
          const iconCloud = audit.items.find(
            (entry) => entry.resourceId === "magicui:icon-cloud"
          );
          if (!iconCloud || !iconCloud.ok) {
            console.error("magicui:icon-cloud did not compile with browser ReactDOMServer");
            console.error(JSON.stringify(iconCloud, null, 2));
            process.exit(1);
          }
          console.log("Magic UI icon-cloud browser render: OK");

          for (const id of ["magicui:tweet-card", "magicui:client-tweet-card"]) {
            const item = audit.items.find((entry) => entry.resourceId === id);
            if (!item || !item.ok) {
              console.error(id + " did not compile with sandboxed dependency CSS");
              console.error(JSON.stringify(item, null, 2));
              process.exit(1);
            }
          }
          console.log("Magic UI tweet previews: OK");
          NODE

      - name: Measure Motion Primitives React preview coverage
        working-directory: tools/resource-etl
        shell: bash
        run: |
          node src/vault-cli.mjs \
            --sources=motion-primitives \
            --all \
            --out=ci-vault-motion-primitives-coverage \
            --react-previews \
            --react-preview-limit=100

          node src/report/react-preview-coverage.mjs \
            --file=ci-vault-motion-primitives-coverage/react-preview-audit.json \
            --provider=motion-primitives

          node - <<'NODE'
          const fs = require("fs");
          const audit = JSON.parse(
            fs.readFileSync(
              "ci-vault-motion-primitives-coverage/react-preview-audit.json",
              "utf8"
            )
          );
          const motion = audit.items.filter((entry) =>
            entry.resourceId.startsWith("motion-primitives:")
          );
          const failed = motion.filter((entry) => !entry.ok);
          if (failed.length) {
            console.error("Motion Primitives still has deferred previews:");
            console.error(JSON.stringify(failed, null, 2));
            process.exit(1);
          }
          console.log("Motion Primitives local hook aliases: OK", motion.length);
          NODE

      - name: Verify standalone Resource Browser
        working-directory: tools/resource-etl
        shell: bash
        run: |
          node --check resource-browser/app.mjs
          node --check src/resource-browser-server.mjs

          node src/resource-browser-server.mjs --port=4177 > /tmp/nagweb-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4177/resource-browser/ > /tmp/nagweb-browser.html; then
              break
            fi
            sleep 0.2
          done

          grep -q "Biblioteca de recursos" /tmp/nagweb-browser.html

          curl -fsS http://127.0.0.1:4177/resource-browser/app.mjs \
            > /tmp/nagweb-browser-app.mjs
          grep -q "createNagWebPersistentVaultClient" /tmp/nagweb-browser-app.mjs
          grep -q "buildResourceApplyEnvelope" /tmp/nagweb-browser-app.mjs

          curl -fsS http://127.0.0.1:4177/src/runtime/persistent-vault-client.mjs \
            > /tmp/nagweb-vault-client.mjs
          grep -q "NagWebPersistentVaultClient" /tmp/nagweb-vault-client.mjs

          curl -fsS http://127.0.0.1:4177/src/runtime/resource-apply-bridge.mjs \
            > /tmp/nagweb-resource-apply-bridge.mjs
          grep -q "NAGWEB_RESOURCE_APPLY_PROTOCOL" /tmp/nagweb-resource-apply-bridge.mjs

          echo "Standalone Resource Browser + Apply Bridge: OK"

      - name: Verify persistent Vault client
        working-directory: tools/resource-etl
        shell: bash
        run: npm run vault:client:smoke

      - name: Smoke test external ETL sources
        working-directory: tools/resource-etl
        shell: bash
        run: |
          set -euo pipefail

          check_source() {
            local source="$1"
            local output
            output="$(node src/cli.mjs --source="$source" --limit=1 --dry-run)"
            printf '%s\n' "$output"
            grep -Eq 'Recursos: [1-9][0-9]*' <<< "$output"
          }

          check_source polyhaven
          check_source shadcn
          check_source ambientcg
          check_source pmndrs
          check_source kenney

      - name: Verify Uiverse autonomous HTML scale
        working-directory: tools/resource-etl
        shell: bash
        run: |
          node src/vault-cli.mjs \
            --sources=uiverse \
            --limit=100 \
            --out=ci-vault-uiverse

          node - <<'NODE'
          const fs = require("fs");
          const catalog = JSON.parse(
            fs.readFileSync("ci-vault-uiverse/catalog.json", "utf8")
          );
          const items = (catalog.resources || []).filter(
            (entry) => entry.id.startsWith("uiverse:")
          );
          if (items.length !== 100) {
            console.error("Expected 100 Uiverse autonomous resources, got", items.length);
            process.exit(1);
          }
          const notReady = items.filter(
            (entry) => entry.previewStatus !== "ready"
          );
          if (notReady.length) {
            console.error("Uiverse scale test has deferred previews");
            console.error(JSON.stringify(notReady, null, 2));
            process.exit(1);
          }
          console.log("Uiverse autonomous scale: OK", items.length);
          NODE

      - name: Verify Uiverse resumable paging
        working-directory: tools/resource-etl
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import {
            extractUiverseComponents,
            getUiverseInventory
          } from "./src/extractors/uiverse.mjs";

          const inventory = await getUiverseInventory();
          if (inventory.totalAvailable < 3000) {
            throw new Error(
              `Unexpectedly small Uiverse inventory: ${inventory.totalAvailable}`
            );
          }

          const first = await extractUiverseComponents({ limit: 20, offset: 0 });
          const second = await extractUiverseComponents({
            limit: 20,
            offset: first.nextOffset
          });

          const firstPaths = new Set(first.items.map((item) => item.entry.path));
          const overlap = second.items.filter((item) =>
            firstPaths.has(item.entry.path)
          );

          if (first.items.length !== 20 || second.items.length !== 20) {
            throw new Error("Expected two complete 20-item Uiverse pages");
          }
          if (overlap.length) {
            throw new Error(
              `Uiverse paging overlap: ${overlap.map((item) => item.entry.path).join(", ")}`
            );
          }
          if (second.startOffset !== first.nextOffset) {
            throw new Error("Uiverse paging cursor did not resume correctly");
          }

          console.log(
            "Uiverse resumable paging: OK",
            first.startOffset,
            first.nextOffset,
            second.nextOffset
          );
          NODE

      - name: Verify Uiverse automatic checkpoint
        working-directory: tools/resource-etl
        shell: bash
        run: |
          rm -rf ci-vault-uiverse-resume

          node src/uiverse-batch-cli.mjs \
            --limit=10 \
            --resume \
            --out=ci-vault-uiverse-resume

          FIRST_OFFSET="$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('ci-vault-uiverse-resume/uiverse-checkpoint.json','utf8'));process.stdout.write(String(c.nextOffset))")"

          node src/uiverse-batch-cli.mjs \
            --limit=10 \
            --resume \
            --out=ci-vault-uiverse-resume

          node - "$FIRST_OFFSET" <<'NODE'
          const fs = require("fs");
          const firstOffset = Number(process.argv[2]);
          const checkpoint = JSON.parse(
            fs.readFileSync(
              "ci-vault-uiverse-resume/uiverse-checkpoint.json",
              "utf8"
            )
          );
          const catalog = JSON.parse(
            fs.readFileSync(
              "ci-vault-uiverse-resume/catalog.json",
              "utf8"
            )
          );
          const uiverse = (catalog.resources || []).filter(
            (entry) => entry.source?.provider === "uiverse"
          );

          if (!(checkpoint.nextOffset > firstOffset)) {
            throw new Error("Uiverse checkpoint did not advance");
          }
          if (uiverse.length !== 20) {
            throw new Error(
              `Expected 20 accumulated Uiverse resources, got ${uiverse.length}`
            );
          }
          if (checkpoint.importedInVault !== 20) {
            throw new Error(
              `Checkpoint expected importedInVault=20, got ${checkpoint.importedInVault}`
            );
          }

          console.log(
            "Uiverse automatic checkpoint: OK",
            firstOffset,
            checkpoint.nextOffset,
            uiverse.length
          );
          NODE

          cp ci-vault-uiverse-resume/uiverse-checkpoint.json \
            ci-vault-uiverse-resume/uiverse-checkpoint.before-guard-test.json

          node - <<'NODE'
          const fs = require("fs");
          const file = "ci-vault-uiverse-resume/uiverse-checkpoint.json";
          const checkpoint = JSON.parse(fs.readFileSync(file, "utf8"));
          checkpoint.sourceCommit = "0000000000000000000000000000000000000000";
          fs.writeFileSync(file, JSON.stringify(checkpoint, null, 2) + "\n");
          NODE

          if node src/uiverse-batch-cli.mjs \
            --limit=10 \
            --resume \
            --out=ci-vault-uiverse-resume; then
            echo "Expected Uiverse resume to fail after source commit mismatch"
            exit 1
          fi

          node - <<'NODE'
          const fs = require("fs");
          const catalog = JSON.parse(
            fs.readFileSync("ci-vault-uiverse-resume/catalog.json", "utf8")
          );
          const uiverse = (catalog.resources || []).filter(
            (entry) => entry.source?.provider === "uiverse"
          );
          if (uiverse.length !== 20) {
            throw new Error(`Source-change guard modified the catalog: ${uiverse.length}`);
          }
          console.log("Uiverse source-change guard: OK", uiverse.length);
          NODE

          mv ci-vault-uiverse-resume/uiverse-checkpoint.before-guard-test.json \
            ci-vault-uiverse-resume/uiverse-checkpoint.json



      - name: Verify SpinKit autonomous loaders
        working-directory: tools/resource-etl
        shell: bash
        run: |
          node src/vault-cli.mjs \
            --sources=spinkit \
            --all \
            --out=ci-vault-spinkit

          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { buildInsertDescriptor } from "./src/runtime/insert-adapters.mjs";

          const catalog = JSON.parse(
            fs.readFileSync("ci-vault-spinkit/catalog.json", "utf8")
          );
          const items = (catalog.resources || []).filter(
            (entry) => entry.source?.provider === "spinkit"
          );

          if (items.length !== 12) {
            throw new Error(`Expected 12 SpinKit loaders, got ${items.length}`);
          }

          const deferred = items.filter(
            (entry) => entry.previewStatus !== "ready"
          );
          if (deferred.length) {
            throw new Error(`SpinKit has deferred previews: ${deferred.length}`);
          }

          const planeEntry = items.find((entry) => entry.id === "spinkit:plane");
          if (!planeEntry?.vaultPath) {
            throw new Error("Missing spinkit:plane resource");
          }

          const plane = JSON.parse(
            fs.readFileSync(
              path.join("ci-vault-spinkit", planeEntry.vaultPath),
              "utf8"
            )
          );

          const descriptor = buildInsertDescriptor(plane, {
            values: { size: 72, color: "#ff0066" }
          });

          if (descriptor.payload.cssVariables["--sk-size"] !== "72px") {
            throw new Error("SpinKit size css-variable binding failed");
          }
          if (descriptor.payload.cssVariables["--sk-color"] !== "#ff0066") {
            throw new Error("SpinKit color css-variable binding failed");
          }

          console.log("SpinKit autonomous loaders: OK", items.length);
          NODE

      - name: Verify Magic.css autonomous effects
        working-directory: tools/resource-etl
        shell: bash
        run: |
          node src/vault-cli.mjs \
            --sources=magic-css \
            --all \
            --out=ci-vault-magic-css

          node - <<'NODE'
          const fs = require("fs");
          const catalog = JSON.parse(
            fs.readFileSync("ci-vault-magic-css/catalog.json", "utf8")
          );
          const items = (catalog.resources || []).filter(
            (entry) => entry.source?.provider === "magic-css"
          );
          if (items.length !== 65) {
            throw new Error(
              `Expected 65 Magic.css effects, got ${items.length}`
            );
          }
          const deferred = items.filter(
            (entry) => entry.previewStatus !== "ready"
          );
          if (deferred.length) {
            throw new Error(
              `Magic.css has deferred previews: ${deferred.length}`
            );
          }
          console.log("Magic.css autonomous effects: OK", items.length);
          NODE

  windows-smoke:
    name: Windows smoke
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install preview compiler dependencies
        working-directory: tools/resource-etl
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run self-test on Windows
        working-directory: tools/resource-etl
        run: npm test

      - name: Build small Windows Vault
        working-directory: tools/resource-etl
        run: node src/vault-cli.mjs --sources=lucide,motion-primitives,animxyz,csshake,glsl-noise --limit=1 --out=ci-vault-windows --react-previews --react-preview-limit=2

      - name: Verify Windows output
        shell: pwsh
        working-directory: tools/resource-etl
        run: |
          if (-not (Test-Path "ci-vault-windows\catalog.json")) { exit 1 }
          if (-not (Test-Path "ci-vault-windows\nagweb-code-library.json")) { exit 1 }
          if (-not (Test-Path "ci-vault-windows\react-preview-audit.json")) { exit 1 }
          if (-not (Test-Path "ci-vault-windows\index.html")) { exit 1 }
          $catalog = Get-Content "ci-vault-windows\catalog.json" -Raw | ConvertFrom-Json
          if ($catalog.count -lt 5) { exit 1 }
          Write-Host "Windows Vault resources:" $catalog.count
